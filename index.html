<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Joy Radio</title>

<style>

body{
    margin:0;
    background:#f4f7fb;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.player{
    width:90%;
    max-width:500px;
    background:white;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#033256;
    margin-bottom:10px;
}

.title{
    font-size:20px;
    margin-bottom:20px;
    color:#444;
}

audio{
    width:100%;
}

</style>
</head>

<body>

<div class="player">

    <div class="logo">
        Joy Radio
    </div>

    <div class="title">
        Give Them A Faith That Remains
    </div>

    <audio controls autoplay>
        <source src="give-them-a-faith-that-remains.mp3" type="audio/mpeg">
    </audio>

</div>

</body>
</html>
